# ===========================================================================
# OpenList for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : openlistteam/openlist:v4.2.9 (Docker Hub, used unmodified)
#                  -> https://github.com/OpenListTeam/OpenList
#
# Ports   : host 8086 -> container 5244. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/openlistdocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# User    : the image declares USER openlist (uid 1001); this package pins
#           1000:1000 so the mounted data folder - which the platform creates
#           and chowns for the packaging user - is writable. The upstream
#           entrypoint refuses to start when ./data is not writable, so the
#           ownership of the host folder matters.
# Health  : GET /ping is a static route served by the application itself, so it
#           answers before the administrator completes the setup wizard.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  openlistdocker:
    image: openlistteam/openlist:v4.2.9
    container_name: openlistdocker
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8086:5244"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/openlistdocker/data:/opt/openlist/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5244/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8086
    protocol: http
